appId: com.bthecoderr.chessuniverse
name: 07-online-signed-out
---
- launchApp
- scrollUntilVisible:
    element:
      id: "home-online"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "home-online"
- assertVisible: "Find your table"
- takeScreenshot: 07-online
- tapOn:
    id: "back"
- scrollUntilVisible:
    element:
      id: "home-games"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "home-games"
- assertVisible: "My Games"
- takeScreenshot: 07b-my-games-signed-out
