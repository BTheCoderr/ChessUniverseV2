name: CI

on:
  push:
    branches: [main, supabase-rebuild]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python3 -m pip install --break-system-packages Pillow==11.3.0
      - run: python3 scripts/sync-brand-icons.py --check
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
