name: Sync Chess Universe icon family

on:
  push:
    branches:
      - fix/favicon-as-single-brand-source-20261116
    paths:
      - ".github/workflows/sync-brand-icons.yml"
      - "scripts/sync-brand-icons.py"
      - "public/brand/knight-icon-512.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic image tooling
        run: python -m pip install Pillow==11.3.0
      - name: Verify favicon is the same design as the source icon
        run: python scripts/sync-brand-icons.py --write
      - name: Verify all native and web icon dimensions and exact pixels
        run: python scripts/sync-brand-icons.py --check
      - name: Commit generated web and native icons to release branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/favicon-64.png public/brand/knight-icon-192.png public/brand/apple-touch-icon.png apps/mobile/assets/logo-mark.png apps/mobile/assets/icon.png
          if git diff --cached --quiet; then
            echo "All icons already match."
          else
            git commit -m "Sync favicon, web icons and native app icon from canonical knight"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
