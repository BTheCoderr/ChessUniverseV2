name: Sync Chess Universe icon family

on:
  push:
    branches:
      - main
      - fix/chess-gold-original-logo-20261116
    paths:
      - ".github/workflows/sync-brand-icons.yml"
      - "scripts/sync-brand-icons.py"
      - "public/brand/gold-cosmic-master.avif"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic image tooling
        run: python -m pip install Pillow==11.3.0
      - name: Generate gold knight asset family from the supplied original
        run: python scripts/sync-brand-icons.py --write
      - name: Verify all native and web branding is derived from the gold master
        run: python scripts/sync-brand-icons.py --check
      - name: Commit generated web and native icons to release branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/favicon-64.png public/brand/knight-icon-192.png public/brand/knight-icon-512.png public/brand/apple-touch-icon.png public/brand/knight-emblem-160.jpg public/brand/knight-emblem-512.jpg public/brand/og-image.jpg apps/mobile/assets/logo-mark.png apps/mobile/assets/icon.png
          if git diff --cached --quiet; then
            echo "All icons already match."
          else
            git commit -m "Sync website and iOS icons from original gold cosmic knight"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
