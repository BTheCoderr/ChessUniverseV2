name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "src/lib/puzzles.ts"
      - "scripts/sync-mobile-*.mjs"
      - "supabase/functions/online-game/rules.mjs"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "src/lib/puzzles.ts"
      - "scripts/sync-mobile-*.mjs"
      - "supabase/functions/online-game/rules.mjs"
      - ".github/workflows/mobile-ci.yml"

jobs:
  mobile-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: python3 -m pip install --break-system-packages Pillow==11.3.0
        working-directory: .
      - run: python3 scripts/sync-brand-icons.py --check
        working-directory: .
      - run: node scripts/sync-mobile-chess-pieces.mjs --check
        working-directory: .
      - run: node scripts/sync-mobile-puzzles.mjs --check
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle the iOS JavaScript (catches import/runtime-resolution errors without EAS)
        run: npx expo export --platform ios --output-dir /tmp/expo-export-ios
