name: Inspect existing gold knight source
on:
  push:
    branches: [fix/ios-gold-cosmic-brand-20261116]
    paths:
      - ".github/workflows/inspect-gold-brand.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow==11.3.0
      - run: |
          python - <<'PY'
          from PIL import Image
          from io import BytesIO
          import base64
          p='public/brand/knight-emblem-512.jpg'
          im=Image.open(p).convert('RGB')
          print('ICON_INFO',p,im.size,im.getpixel((im.width//2,im.height//2)))
          im.thumbnail((180,180))
          buf=BytesIO()
          im.save(buf,format='JPEG',quality=50,optimize=True)
          print('BEGIN_GOLD_ICON_BASE64')
          print(base64.b64encode(buf.getvalue()).decode('ascii'))
          print('END_GOLD_ICON_BASE64')
          PY