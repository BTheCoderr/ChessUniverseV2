name: Refresh iOS Chess Piece SVG Dependency Lock
on:
  push:
    branches: [fix/unify-native-chess-pieces-20261117]
    paths:
      - ".github/workflows/refresh-native-piece-lock.yml"
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recalculate lockfile for Expo 54 compatible vector renderer
        working-directory: apps/mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify canonical chess artwork
        run: node scripts/sync-mobile-chess-pieces.mjs --check
      - name: Commit dependency lockfile to the feature branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lockfile already current."
          else
            git commit -m "Lock Expo 54 SVG chess renderer dependencies"
            git push origin "HEAD:${REF_NAME}"
          fi
